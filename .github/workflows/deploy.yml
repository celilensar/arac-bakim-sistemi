# ============================================================
#  CI/CD - query-api'yi build edip ECR'ye push eder
# ============================================================

name: Deploy query-api

# NE ZAMAN calisir: main'e query-api (veya bu dosya) degisikligi push edilince
on:
  push:
    branches: [main]
    paths:
      - "query-api/**"
      - ".github/workflows/deploy.yml"

# OIDC token alabilmek icin GEREKLI izin (uzun omurlu anahtar yok)
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPO: query-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest # GitHub'in sagladigi gecici Linux makinesi
    steps:
      # 1) Repo kodunu runner'a indir
      - name: Checkout
        uses: actions/checkout@v4

      # 2) OIDC ile AWS kimligi al -> github-actions-deploy rolunu ustlen
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::508564776181:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # 3) Docker'i ECR'ye login et (registry adresini cikti olarak verir)
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4) Image'i build et + iki etiketle push et:
      #    latest (guncel) ve commit SHA (o ana ait, geri donebilmek icin)
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO:latest -t $REGISTRY/$ECR_REPO:${{ github.sha }} ./query-api
          docker push $REGISTRY/$ECR_REPO:latest
          docker push $REGISTRY/$ECR_REPO:${{ github.sha }}

      # 5) Deploy: ECS servisi ayaktaysa yeni image ile guncelle.
      #    Servis durdurulmus (desired=0) veya yoksa pipeline'i kirmadan atla.
      - name: Deploy to ECS (if running)
        run: |
          STATUS=$(aws ecs describe-services --cluster default --services query-api \
            --region $AWS_REGION --query 'services[0].status' --output text 2>/dev/null || echo "NONE")
          if [ "$STATUS" = "ACTIVE" ]; then
            aws ecs update-service --cluster default --service query-api \
              --force-new-deployment --region $AWS_REGION
            echo "ECS servisi yeni image ile guncellendi."
          else
            echo "ECS servisi calismiyor (durum: $STATUS). Image ECR'de hazir; deploy atlandi."
          fi
