spring.application.name=query-api

# REST API'nin dinleyecegi port (tarayicidan http://localhost:8080)
server.port=8080

# --- AWS / LocalStack ---
aws.region=eu-central-1
aws.endpoint=http://localhost:4566
aws.access-key=test
aws.secret-key=test

# --- Kaynak isimleri ---
app.dynamodb.table-name=telemetry
app.dynamodb.state-table-name=vehicle_state
app.sqs.dashboard-queue-name=dashboard-queue

# Dashboard kuyrugu yoklama araligi
app.poll.interval-ms=1000

# React gelistirme sunucusunun adresi (CORS izni)
app.cors.allowed-origin=http://localhost:5173
