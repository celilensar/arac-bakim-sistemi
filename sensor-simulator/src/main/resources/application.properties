spring.application.name=sensor-simulator

# --- AWS / LocalStack ayarlari ---
# Gercek AWS yerine lokaldeki LocalStack'e baglaniyoruz (port 4566).
aws.region=eu-central-1
aws.endpoint=http://localhost:4566
# LocalStack gercek kimlik dogrulamasi yapmaz ama SDK bos birakamaz; sahte degerler.
aws.access-key=test
aws.secret-key=test

# --- Simulator ayarlari ---
app.sqs.queue-name=telemetry-queue
# Kac arac simule edilecek (VH-001, VH-002, ...)
app.simulator.vehicle-count=3
# Kac milisaniyede bir telemetri uretilip gonderilecek (5000 = 5 sn)
app.simulator.interval-ms=5000
