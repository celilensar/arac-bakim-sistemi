spring.application.name=notification-service

# --- AWS / LocalStack ---
aws.region=eu-central-1
aws.endpoint=http://localhost:4566
aws.access-key=test
aws.secret-key=test

# --- Kaynak isimleri ---
app.sqs.alerts-queue-name=alerts-queue
app.sns.notify-topic-name=alert-notifications

# Kuyruk yoklama araligi
app.poll.interval-ms=1000

# Sadece bu seviyedeki uyarilar bildirim olarak gonderilsin (BILGI atlanir)
app.notify.severities=KRITIK,UYARI

# Uyari yorgunlugu (alert fatigue) onlemi: ayni arac+kural icin bu sure boyunca
# tek bildirim gonderilir; tekrarlar atlanir. (120 sn; uretimde ~15 dk yapilabilir)
app.notify.cooldown-seconds=120

# --- Redis (paylasilan cooldown durumu) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Cooldown deposu: "redis" (dagitik) veya "memory" (tek instance, Redis'siz calisir)
app.cooldown.store=redis
