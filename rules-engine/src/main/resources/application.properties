spring.application.name=rules-engine

# --- AWS / LocalStack ---
aws.region=eu-central-1
aws.endpoint=http://localhost:4566
aws.access-key=test
aws.secret-key=test

# --- Kaynak isimleri ---
app.sqs.rules-queue-name=rules-queue
app.sqs.alerts-queue-name=alerts-queue
app.dynamodb.alerts-table-name=alerts
app.dynamodb.thresholds-table-name=thresholds

# Kural motoru kuyrugu ne siklikta yoklanacak
app.poll.interval-ms=1000

# Esikler tablodan ne siklikta yenilenecek (30 sn) -> degisiklik restart'siz etkili olur
app.thresholds.refresh-ms=30000
